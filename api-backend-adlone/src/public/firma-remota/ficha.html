<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:,">
    <title>Firma de ficha · ADL One</title>
    <style>
        :root { --azul: #1d4ed8; --borde: #e2e8f0; --texto: #0f172a; --gris: #64748b; --verde: #15803d; --rojo: #b91c1c; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: var(--texto); }
        header { background: var(--azul); color: #fff; padding: 14px 16px; }
        header h1 { margin: 0; font-size: 17px; }
        header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
        main { padding: 14px 16px 24px; max-width: 560px; margin: 0 auto; }
        .nota { font-size: 13px; color: var(--gris); margin: 0 0 10px; }
        .lista { display: flex; flex-direction: column; gap: 8px; }
        button { font: inherit; border-radius: 10px; border: 1px solid var(--borde); padding: 14px; font-size: 16px; font-weight: 600; }
        button:disabled { opacity: .45; }
        .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #fff; border-radius: 12px; padding: 12px; font-weight: 400; }
        .item:active { background: #eff6ff; border-color: var(--azul); }
        .item .datos { flex: 1; min-width: 0; }
        .item .titulo { font-weight: 700; font-size: 15px; }
        .item .nombre { font-size: 12px; color: var(--gris); }
        .item .ir { color: var(--azul); font-weight: 700; font-size: 14px; white-space: nowrap; }
        .item .hecho { color: var(--verde); font-size: 13px; font-weight: 700; white-space: nowrap; }
        /* Firma ya hecha en la ficha: en gris y sin poder firmarse de nuevo. */
        .item.bloqueada { background: #f1f5f9; opacity: .6; cursor: default; }
        .item.bloqueada .hecho { color: var(--gris); }
        .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
        .tarjeta b { display: block; font-size: 16px; }
        .tarjeta span { font-size: 13px; color: var(--gris); }
        .lienzo { position: relative; background: #fff; border: 2px dashed #94a3b8; border-radius: 12px; height: 240px; touch-action: none; overflow: hidden; }
        .lienzo canvas { width: 100%; height: 100%; display: block; }
        .lienzo .guia { position: absolute; left: 24px; right: 24px; bottom: 44px; border-bottom: 1px solid #cbd5e1; pointer-events: none; }
        .lienzo .ayuda { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 15px; pointer-events: none; }
        .acciones { display: flex; gap: 10px; margin-top: 12px; }
        .secundario { background: #fff; color: var(--texto); flex: 1; }
        .grabar { background: var(--azul); color: #fff; border-color: var(--azul); flex: 2; }
        .aviso { text-align: center; padding: 40px 16px; }
        .aviso .icono { font-size: 54px; line-height: 1; }
        .aviso h2 { margin: 12px 0 6px; font-size: 20px; }
        .aviso p { color: var(--gris); margin: 0; }
        .oculto { display: none !important; }
        .msg-error { color: var(--rojo); font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1 id="titulo">Firma de ficha</h1>
        <p id="subtitulo"></p>
    </header>
    <main>
        <div id="cargando" class="aviso"><p>Cargando…</p></div>

        <div id="invalido" class="aviso oculto">
            <div class="icono">⚠️</div>
            <h2>Enlace no válido</h2>
            <p id="invalido-texto">Este enlace de firma no es válido o ya venció. Pida que generen un código QR nuevo.</p>
        </div>

        <div id="lista-vista" class="oculto">
            <p class="nota" id="nota-lista">Toque la firma que le corresponde.</p>
            <div id="lista" class="lista"></div>
            <div id="completo" class="aviso oculto">
                <div class="icono">✅</div>
                <h2>Firmas enviadas</h2>
                <p>Ya puede volver al computador: las firmas aparecen en la ficha.</p>
            </div>
        </div>

        <div id="firmar-vista" class="oculto">
            <div class="tarjeta"><b id="f-titulo"></b><span id="f-nombre"></span></div>
            <div class="lienzo" id="lienzo">
                <canvas id="canvas"></canvas>
                <div class="guia"></div>
                <div class="ayuda" id="ayuda">Firme aquí con el dedo</div>
            </div>
            <div class="acciones">
                <button class="secundario" id="volver">Volver</button>
                <button class="secundario" id="limpiar" disabled>Limpiar</button>
                <button class="grabar" id="grabar" disabled>Grabar firma</button>
            </div>
            <p class="msg-error oculto" id="error"></p>
        </div>
    </main>
    <script src="/firma/assets/ficha.js"></script>
</body>
</html>
